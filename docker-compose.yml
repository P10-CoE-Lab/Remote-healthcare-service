version: "3.8"

# =============================================================
# Remote Healthcare Service — Full Stack
# =============================================================
# Start:  docker compose up -d --build
# Stop:   docker compose down
#
# Ports:
#   1883  MQTT broker
#   8086  InfluxDB
#   3000  Grafana        (admin / ${GRAFANA_PASSWORD:-admin})
#   8000  Notification Service
#   8025  Mailhog web UI (view test alert emails)
# =============================================================

services:

  # -----------------------------------------------------------
  # Infrastructure
  # -----------------------------------------------------------

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE:        setup
      DOCKER_INFLUXDB_INIT_USERNAME:    admin
      DOCKER_INFLUXDB_INIT_PASSWORD:    adminpassword
      DOCKER_INFLUXDB_INIT_ORG:         iot_org
      DOCKER_INFLUXDB_INIT_BUCKET:      vitals
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-my-super-secret-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

  # -----------------------------------------------------------
  # Application Services
  # -----------------------------------------------------------

  remote-healthcare:
    build: ./healthcare_service
    environment:
      MQTT_HOST:        mosquitto
      MQTT_PORT:        "1883"
      MQTT_TOPIC:       "iots/#"
      INFLUXDB_URL:     http://influxdb:8086
      INFLUXDB_TOKEN:   ${INFLUXDB_TOKEN:-my-super-secret-token}
      INFLUXDB_ORG:     iot_org
      INFLUXDB_BUCKET:  vitals
      NOTIFICATION_URL: http://notification:8000/notify
      ALERT_EMAIL:      ${ALERT_EMAIL:-test@example.com}
      ALERT_PHONE:      ${ALERT_PHONE:-}
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build: ./simulator_service
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    command: >
      --persona personas/cardiac_patient.yaml
      --scenario scenarios/health/tachycardia_episode.yaml
      --compression 10
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  notification:
    build: ./notification
    ports:
      - "8000:8000"
    environment:
      NOTIFICATION_CONFIG_PATH: /app/notification-config.yaml
      MAILHOG_HOST:             mailhog
      MAILHOG_PORT:             "1025"
      GMAIL_ADDRESS:            ${GMAIL_ADDRESS:-}
      GMAIL_APP_PASSWORD:       ${GMAIL_APP_PASSWORD:-}
    volumes:
      - ./notification-config.yaml:/app/notification-config.yaml:ro
      - ./notification/templates:/app/templates:ro
      - notification_logs:/app/logs
    depends_on:
      - mailhog
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
  notification_logs:
