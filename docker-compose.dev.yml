# docker-compose.dev.yml
# -------------------------
# Developer convenience stack for testing the simulator locally.
# This is NOT the production setup — each POC project has its own compose.
#
# Stack: Mosquitto (MQTT) → Telegraf → InfluxDB → Grafana
# The simulator runs separately on the host: python run.py ...
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   source .venv/bin/activate
#   python run.py --persona personas/welder_factory.yaml \
#                 --scenario scenarios/worker/fatigue_escalation.yaml \
#                 --compression 60 --demo

version: "3.8"

services:

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: iot_org
      DOCKER_INFLUXDB_INIT_BUCKET: iot_poc
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  telegraf:
    image: telegraf:1.30
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./docker/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  notification-service:
    build: ./Notification_Service
    ports:
      - "8001:8000"
    volumes:
      - ./Notification_Service/templates:/app/templates:ro
      - ./Notification_Service/notification-config.yaml:/app/notification-config.yaml:ro
      - ./Notification_Service/logs:/app/logs
    env_file:
      - ./Notification_Service/.env
    depends_on:
      - mailhog
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
