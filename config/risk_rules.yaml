# config/risk_rules.yaml
# ----------------------
# Risk scoring rules (R1-R10) for worker safety monitoring.

schema_version: "1.0"

risk_levels:
  low: 10
  medium: 30
  high: 60
  critical: 80

rules:
  - id: "R1"
    description: "Worker enters restricted or hazard zone"
    weight: 40
    evaluation_window_seconds: 0
    condition:
      type: "hazard_zone_entry"
      parameters:
        zone_types: ["hazard", "restricted"]

  - id: "R2"
    description: "Worker too close to running machine"
    weight: 60
    evaluation_window_seconds: 0
    condition:
      type: "unsafe_machine_proximity"
      parameters:
        danger_radius: 2.0

  - id: "R3"
    description: "Worker stationary near running machine"
    weight: 50
    evaluation_window_seconds: 10
    condition:
      type: "stationary_near_running_machine"
      parameters:
        motion_threshold: 0.08
        danger_radius: 2.0

  - id: "R4"
    description: "PPE violation in hazardous zone"
    weight: 35
    evaluation_window_seconds: 0
    condition:
      type: "ppe_violation_hazard_zone"
      parameters: {}

  - id: "R5"
    description: "Fall detected by wearable"
    weight: 80
    evaluation_window_seconds: 0
    condition:
      type: "fall_detected"
      parameters:
        accel_fall_threshold: 3.0

  - id: "R6"
    description: "Abnormal heart rate spike"
    weight: 30
    evaluation_window_seconds: 60
    condition:
      type: "heart_rate_spike"
      parameters:
        heart_rate_threshold: 140

  - id: "R7"
    description: "Fatigue risk during late shift"
    weight: 25
    evaluation_window_seconds: 120
    condition:
      type: "late_shift_fatigue"
      parameters:
        fatigue_hr_threshold: 95
        hours_worked_threshold: 6

  - id: "R8"
    description: "Worker remains in hazard zone too long"
    weight: 20
    evaluation_window_seconds: 300
    condition:
      type: "hazard_zone_dwell_time"
      parameters:
        time_in_zone_threshold_seconds: 120

  - id: "R9"
    description: "Machine overheating risk near worker"
    weight: 40
    evaluation_window_seconds: 30
    condition:
      type: "machine_overheating_near_worker"
      parameters:
        machine_temperature_threshold: 85
        danger_radius: 2.0

  - id: "R10"
    description: "Multiple violations in short period"
    weight: 50
    evaluation_window_seconds: 180
    condition:
      type: "multiple_violations_short_period"
      parameters:
        events_threshold: 3
        window_seconds: 180

  # ---------------------------------------------------------------------------
  # Healthcare rules (H1-H4) — cardiac patient monitoring
  # ---------------------------------------------------------------------------

  - id: "H1"
    description: "Critically low blood oxygen (SpO2)"
    weight: 80
    evaluation_window_seconds: 0
    condition:
      type: "spo2_critically_low"
      parameters:
        spo2_threshold: 93

  - id: "H2"
    description: "Tachycardia — sustained high heart rate"
    weight: 60
    evaluation_window_seconds: 30
    condition:
      type: "tachycardia"
      parameters:
        heart_rate_threshold: 100

  - id: "H3"
    description: "Bradycardia — dangerously low heart rate"
    weight: 60
    evaluation_window_seconds: 30
    condition:
      type: "bradycardia"
      parameters:
        heart_rate_threshold: 50

  - id: "H4"
    description: "Critically low HRV — cardiac stress indicator"
    weight: 40
    evaluation_window_seconds: 120
    condition:
      type: "hrv_critically_low"
      parameters:
        hrv_threshold: 20
