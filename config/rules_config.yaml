# config/rules_config.yaml
# ----------------------------
# Rules engine configuration for the Vitals Simulator.
# Define monitoring rules that trigger alerts, events, or actions
# based on sensor readings and conditions.

schema_version: "1.0"

# ---------------------------------------------------------------------------
# Engine settings
# ---------------------------------------------------------------------------
engine:
  # How often to evaluate all rules (real seconds)
  evaluation_interval_seconds: 1.0
  
  # Maximum number of rule violations to store in memory
  max_violation_history: 1000
  
  # Whether to log rule evaluations (verbose)
  log_evaluations: false
  
  # Whether to publish rule violations to MQTT
  publish_violations: true

# ---------------------------------------------------------------------------
# Rule definitions
# ---------------------------------------------------------------------------
rules:
  # Worker Safety Rules
  - id: "heart_rate_elevated"
    name: "Elevated Heart Rate Alert"
    description: "Detect when worker's heart rate exceeds safe thresholds"
    category: "safety"
    severity: "warning"
    enabled: true
    
    # Conditions that must be met
    conditions:
      - sensor: "heart_rate"
        operator: ">"
        threshold: 100
        duration_seconds: 5  # Must be true for 5 seconds
    
    # Actions to take when rule triggers
    actions:
      - type: "log"
        message: "Worker {persona_id} heart rate elevated: {value} bpm"
      - type: "mqtt_alert"
        topic: "alerts/worker_safety/{persona_id}/heart_rate"
      - type: "scenario_event"
        event_name: "heart_rate_alert"

  - id: "temperature_heat_stress"
    name: "Heat Stress Detection"
    description: "Detect potential heat stress from elevated body temperature"
    category: "safety"
    severity: "critical"
    enabled: true
    
    conditions:
      - sensor: "skin_temperature"
        operator: ">="
        threshold: 37.5
        duration_seconds: 5
    
    actions:
      - type: "log"
        message: "CRITICAL: Heat stress detected for {persona_id}: {value}°C"
      - type: "mqtt_alert"
        topic: "alerts/worker_safety/{persona_id}/heat_stress"
        payload:
          alert_type: "heat_stress"
          severity: "critical"
          temperature: "{value}"
          timestamp: "{timestamp}"

  - id: "posture_unsafe"
    name: "Unsafe Posture Alert"
    description: "Alert when worker maintains unsafe bending posture"
    category: "ergonomics"
    severity: "warning"
    enabled: true
    
    conditions:
      - sensor: "posture_angle"
        operator: ">"
        threshold: 35
        duration_seconds: 5  # Unsafe posture for 5 seconds
    
    actions:
      - type: "log"
        message: "Unsafe posture detected for {persona_id}: {value}° for {duration}s"
      - type: "mqtt_alert"
        topic: "alerts/worker_safety/{persona_id}/posture"

  - id: "fall_detection"
    name: "Fall Detection"
    description: "Detect sudden impact indicating potential fall"
    category: "emergency"
    severity: "critical"
    enabled: true
    
    conditions:
      - sensor: "accel_magnitude"
        operator: ">"
        threshold: 3.0
        duration_seconds: 0  # Immediate trigger
    
    actions:
      - type: "log"
        message: "EMERGENCY: Fall detected for {persona_id}: {value}g impact"
      - type: "mqtt_alert"
        topic: "alerts/emergency/{persona_id}/fall"
        payload:
          alert_type: "fall_detected"
          severity: "emergency"
          impact_force: "{value}"
          timestamp: "{timestamp}"
          location: "factory_floor"
      - type: "scenario_event"
        event_name: "fall_detected"

  # Healthcare Rules
  - id: "spo2_low"
    name: "Low Blood Oxygen"
    description: "Detect dangerously low SpO2 levels"
    category: "health"
    severity: "critical"
    enabled: true
    
    conditions:
      - sensor: "spo2"
        operator: "<"
        threshold: 90
        duration_seconds: 30
    
    actions:
      - type: "log"
        message: "CRITICAL: Low SpO2 for {persona_id}: {value}%"
      - type: "mqtt_alert"
        topic: "alerts/healthcare/{persona_id}/spo2_low"

  - id: "heart_rate_variability_low"
    name: "Low HRV Alert"
    description: "Detect stress indicators from low heart rate variability"
    category: "wellness"
    severity: "info"
    enabled: true
    
    conditions:
      - sensor: "heart_rate_variability"
        operator: "<"
        threshold: 20
        duration_seconds: 300  # 5 minutes
    
    actions:
      - type: "log"
        message: "Low HRV detected for {persona_id}: {value}ms (possible stress)"
      - type: "mqtt_alert"
        topic: "alerts/healthcare/{persona_id}/hrv_low"

  # Composite Rules (multiple conditions)
  - id: "fatigue_combination"
    name: "Fatigue Indicator Combination"
    description: "Multiple indicators suggesting worker fatigue"
    category: "safety"
    severity: "warning"
    enabled: true
    
    # All conditions must be true (AND logic)
    logical_operator: "AND"
    conditions:
      - sensor: "heart_rate"
        operator: ">"
        threshold: 90
        duration_seconds: 5
      - sensor: "skin_temperature"
        operator: ">"
        threshold: 37.0
        duration_seconds: 5
      - sensor: "posture_angle"
        operator: ">"
        threshold: 25
        duration_seconds: 5
    
    actions:
      - type: "log"
        message: "Fatigue indicators detected for {persona_id}"
      - type: "mqtt_alert"
        topic: "alerts/worker_safety/{persona_id}/fatigue"
        payload:
          alert_type: "fatigue_detected"
          indicators: ["elevated_hr", "elevated_temp", "poor_posture"]

# ---------------------------------------------------------------------------
# Alert configuration
# ---------------------------------------------------------------------------
alert_config:
  # MQTT topic prefix for alerts
  mqtt_topic_prefix: "alerts"
  
  # Whether to include full sensor context in alerts
  include_sensor_context: true
  
  # Cooldown period to prevent spam (seconds)
  alert_cooldown_seconds: 30
  
  # Alert message templates
  templates:
    warning: "⚠️  {rule_name}: {message}"
    critical: "🚨 CRITICAL: {rule_name}: {message}"
    emergency: "🆘 EMERGENCY: {rule_name}: {message}"
    info: "ℹ️  {rule_name}: {message}"
