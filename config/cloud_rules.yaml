# config/cloud_rules.yaml
# ------------------------
# Windowed risk scoring rules for the cloud engine.
# These require sustained readings over a time window to confirm.
# The cloud engine subscribes to MQTT, maintains rolling buffers,
# and evaluates these rules periodically.

schema_version: "1.0"

# Risk level thresholds (cumulative score → level)
risk_levels:
  none:     0
  low:      10
  medium:   30
  high:     60
  critical: 80

# Default cooldown between repeated alerts for same rule + patient (seconds)
default_cooldown_seconds: 60

# How often to evaluate all rules (seconds)
evaluation_interval_seconds: 5

# Topic pattern for cloud alerts:
#   alerts/cloud/{persona_id}/{rule_id}
alert_topic_prefix: "alerts/cloud"

# Fraction of readings in the window that must breach for rule to fire
default_fraction_required: 0.70

rules:
  # Single-sensor windowed rules
  - id: "H2-cloud"
    description: "Tachycardia sustained — HR elevated for 30 seconds"
    window_seconds: 30
    fraction_required: 0.70
    weight: 60
    severity: "warning"
    cooldown_seconds: 60
    condition:
      sensor: "heart_rate"
      operator: ">"
      threshold: 100

  - id: "H3-cloud"
    description: "Bradycardia sustained — HR low for 30 seconds"
    window_seconds: 30
    fraction_required: 0.70
    weight: 60
    severity: "critical"
    cooldown_seconds: 60
    condition:
      sensor: "heart_rate"
      operator: "<"
      threshold: 50

  - id: "H4"
    description: "HRV critically low sustained — cardiac stress over 2 minutes"
    window_seconds: 120
    fraction_required: 0.80
    weight: 40
    severity: "warning"
    cooldown_seconds: 120
    condition:
      sensor: "heart_rate_variability"
      operator: "<"
      threshold: 20

  # Multi-sensor windowed rule (AND: both conditions must be sustained)
  - id: "H-COMBINED"
    description: "Combined deterioration — HR high AND SpO2 low simultaneously"
    window_seconds: 30
    fraction_required: 0.60
    weight: 80
    severity: "critical"
    cooldown_seconds: 60
    multi_conditions:
      - sensor: "heart_rate"
        operator: ">"
        threshold: 100
      - sensor: "spo2"
        operator: "<"
        threshold: 93

personalised_baseline:
  enabled: true
  min_training_samples: 150         # feature vectors needed before training
  min_training_window_seconds: 240  # real-time minimum before training (4 real minutes)
  anomaly_threshold: 0.80           # 0–1, how anomalous before alert fires
  contamination: 0.05               # IsolationForest contamination param
  feature_window_hr_seconds: 30     # window for HR/SpO2 features
  feature_window_hrv_seconds: 120   # window for HRV features
  cooldown_seconds: 60              # per-device cooldown between AI alerts
