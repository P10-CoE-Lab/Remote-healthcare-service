# Mosquitto config for local development

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Raw MQTT — used by the simulator and by real hardware (ESP32, etc.)
listener 1883
allow_anonymous true

# MQTT-over-WebSocket — used by browser dashboards (browsers can't open raw TCP sockets)
listener 9001
protocol websockets
allow_anonymous true
